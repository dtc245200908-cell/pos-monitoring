global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: pos_app
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ["pos_app:5001"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
